<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sports AI</title><style>
:root{--bg:#07100f;--card:#0c1717;--card2:#101e1d;--line:#20302e;--txt:#f5f7f6;--mut:#8ea09d;--g:#38db82;--r:#ff6d62;--y:#ffbd59;--b:#7f8cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#123126 0,transparent 28%),var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:30;background:#07100fe8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0d}.nav{max-width:900px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px}.logo{font-weight:950;letter-spacing:.4px}.logo i{font-style:normal;color:var(--g)}.tag{margin-left:auto;color:var(--mut);font-size:12px;border:1px solid var(--line);border-radius:99px;padding:7px 10px}
main{max-width:900px;margin:auto;padding:22px 20px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 20px}.hero h1{font-size:clamp(32px,5vw,58px);line-height:.98;margin:0}.hero p{max-width:620px;color:var(--mut);line-height:1.5}
.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tab{border:1px solid var(--line);background:#0b1716;color:var(--mut);padding:10px 15px;border-radius:99px;cursor:pointer}.tab.on{background:#173127;color:#fff;border-color:#2f6b4d}
.grid{display:grid;grid-template-columns:1fr;gap:7px}.match{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--card),#091312);padding:16px;cursor:pointer;transition:.15s}.match:hover{transform:translateY(-2px);border-color:#3d5551}.match.final{border-color:#24553a}
.meta{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}.badge{margin-left:auto;border-radius:99px;padding:5px 8px;font-weight:800}.badge.final{background:#12331f;color:#62e596}.badge.next{background:#19233b;color:#a9b0ff}.badge.pending{background:#3b2d12;color:#ffd36a}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:13px 0}.name{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.num{font-size:24px;font-weight:950}.bar{height:7px;background:#172421;border-radius:99px;display:flex;overflow:hidden}.bar span:first-child{background:var(--b)}.bar span:last-child{background:var(--g)}
.hint{color:var(--mut);font-size:12px;margin-top:11px}.drawerbg{display:none;position:fixed;inset:0;background:#000b;z-index:50}.drawerbg.on{display:block}.drawer{display:none;position:fixed;z-index:51;inset:4vh max(18px,calc((100vw - 1180px)/2));background:#081312;border:1px solid #2a3e3a;border-radius:25px;overflow:auto}.drawer.on{display:block}
.dhead{position:sticky;top:0;z-index:5;background:#081312ee;backdrop-filter:blur(15px);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#10201e;color:#fff}.content{padding:18px}.scorehero{border:1px solid var(--line);border-radius:22px;padding:20px;background:linear-gradient(135deg,#12221f,#0b1715)}.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.versus>div:last-child{text-align:right}.big{font-size:clamp(34px,6vw,58px);font-weight:950}.vs{color:var(--mut);font-weight:900}
.columns{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.panel{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}.panel h3{margin:0 0 12px;font-size:15px}.text{line-height:1.6;color:#dce5e2}
.signal{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0b}.signal:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--y);flex:none}.good .dot{background:var(--g)}.bad .dot{background:var(--r)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid var(--line);background:#091413;border-radius:13px;padding:11px}.stat small{display:block;color:var(--mut);margin-bottom:4px}.stat b{font-size:19px}
.compare{display:grid;gap:7px}.cmp{display:grid;grid-template-columns:80px 1fr 80px;gap:8px;align-items:center;font-size:12px}.cmp .lab{text-align:center;color:var(--mut)}.track{height:8px;background:#182623;border-radius:99px;overflow:hidden;display:flex}.a{background:var(--b)}.b{background:var(--g)}
.warn{border-color:#674326;background:#1b160d}.audit{border-color:#5c302a;background:#1a1110}.finalbox{border-color:#24553a;background:#0c1c13}.mut{color:var(--mut);font-size:12px}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}
@media(max-width:620px){main{padding:14px}.nav{padding:12px 14px}.grid{grid-template-columns:1fr}.hero{display:block}.drawer{inset:auto 0 0;max-height:94vh;border-radius:24px 24px 0 0}.content{padding:14px}.stats{grid-template-columns:1fr 1fr}.cmp{grid-template-columns:66px 1fr 66px}}

.datebar{max-width:900px;margin:0 auto 12px;display:flex;justify-content:center;align-items:center;gap:22px;padding:10px 16px}
.datebar button{background:#15191f;border:1px solid #2b3139;color:#fff;border-radius:9px;width:38px;height:38px;font-size:22px;cursor:pointer}
.datebar div{text-align:center;min-width:150px}.datebar small{display:block;color:#7f8996;font-size:10px;letter-spacing:1.2px}.datebar strong{font-size:14px}
.match{padding:12px 16px!important;border-radius:10px!important;margin-bottom:7px}
.match .meta{font-size:11px}.match .row{min-height:29px}.match .name{font-size:14px}.match .num{font-size:14px}
.tourneyHead{padding:10px 4px 6px;margin-top:12px;color:#dfe6ee;font-size:12px;font-weight:800;letter-spacing:.4px}
.tourneyHead span{color:#7f8996;font-weight:500;margin-left:7px}

.badge.live{background:#3b1212;color:#ff6b6b;animation:pulse 1.4s infinite}
.match.live{border-color:#6d2020;box-shadow:0 0 0 1px rgba(255,70,70,.08)}
.liveScore{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:#dfe6ee}
.liveDot{width:7px;height:7px;border-radius:50%;background:#ff4d4d;display:inline-block;animation:pulse 1.2s infinite}
.gameScore{font-weight:800;color:#ff8383}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.liveBoard{margin-top:10px;border-top:1px solid #ffffff12;padding-top:9px}.scoreGrid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(5,28px) 44px;gap:5px;align-items:center;font-size:12px}.scoreGrid .sh{color:var(--mut);font-size:9px;text-align:center;font-weight:800}.scoreGrid .sn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scoreGrid .sv{text-align:center;font-weight:900}.scoreGrid .cur{color:var(--g)}.scoreGrid .pts{color:#ff8383}.setNow{margin-top:7px;color:var(--mut);font-size:11px}.setNow b{color:#fff}


.badge.interrupted{background:#3a2d10;color:#ffd15c}
.match.interrupted{border-color:#6e5620}
.interruptedLine{margin-top:7px;font-size:12px;color:#ffd15c;font-weight:800}
</style></head><body>
<header><div class="nav"><div class="logo">SPORTS <i>AI</i> · TENNIS</div><div class="tag">AUTO · cada 10 min</div></div></header>
<main><section class="hero"><div><h1>Entiende el partido,<br>no solo el porcentaje.</h1></div><p>Predicción, matchup, forma, torneo, fatiga, presión y señales que contradicen al favorito. Cada resultado queda auditado.</p></section>
<div class="tabs"><button class="tab" data-f="live">En vivo</button><button class="tab on" data-f="next">Próximos</button><button class="tab" data-f="final">Resultados</button><button class="tab" data-f="pending">Pendientes</button><button class="tab" data-f="all">Todos</button></div>
<div class="datebar">
  <button id="prevDay" type="button">‹</button>
  <div><small>PARTIDOS</small><strong id="selectedDate">HOY</strong></div>
  <button id="nextDay" type="button">›</button>
</div><div id="grid" class="grid"></div></main>
<div id="bg" class="drawerbg"></div><aside id="drawer" class="drawer"><div class="dhead"><b>Análisis completo</b><button id="x" class="x">✕</button></div><div id="detail" class="content"></div></aside>
<script>
let M=[];let filter='next'; const pct=x=>(Number(x||0)*100).toFixed(1)+'%';

// V25: GitHub Pages keeps the full prediction/history dataset.
// Cloudflare supplies the fast live-state overlay pushed by GitHub Actions.
const LIVE_API='https://sports-ai-live.ruth198027.workers.dev/live';

async function fetchMatches(){
  const url='matches.json?v='+Date.now();
  const r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!r.ok) throw new Error('No se pudo actualizar matches.json');
  return r.json();
}

async function fetchLive(){
  const r=await fetch(LIVE_API+'?v='+Date.now(),{
    cache:'no-store',
    headers:{'Cache-Control':'no-cache'}
  });
  if(!r.ok) throw new Error('Cloudflare /live respondió '+r.status);
  const data=await r.json();
  if(!data?.ok || !Array.isArray(data.matches)) throw new Error('Respuesta /live inválida');
  return data.matches;
}

function mergeLive(base,live){
  const byId=new Map((live||[]).filter(x=>x?.match_id).map(x=>[String(x.match_id),x]));
  const used=new Set();

  const merged=(base||[]).map(m=>{
    const l=byId.get(String(m.match_id));
    if(!l) return m;
    used.add(String(m.match_id));

    // Live snapshot is newer for status/score fields, while the base object
    // remains authoritative for the complete prediction/analysis payload.
    return {
      ...m,
      ...l,
      analysis:m.analysis||l.analysis,
      written_analysis:m.written_analysis||l.written_analysis,
      style_matchup:m.style_matchup||l.style_matchup,
      tournament_performance:m.tournament_performance||l.tournament_performance,
      live_state:l.live_state||m.live_state
    };
  });

  // Safety: if a newly discovered match reaches Cloudflare before Pages has
  // published the newest matches.json, show it immediately instead of hiding it.
  (live||[]).forEach(l=>{
    if(l?.match_id && !used.has(String(l.match_id))) merged.push(l);
  });
  return merged;
}

async function refreshLive(){
  try{
    const live=await fetchLive();
    M=mergeLive(M,live);
    render();
  }catch(e){
    console.warn('Live API fallback:',e);
  }
}

async function refreshBase(){
  try{
    const base=await fetchMatches();
    try{
      const live=await fetchLive();
      M=mergeLive(base,live);
    }catch(e){
      M=base;
      console.warn('Cloudflare no disponible; usando matches.json:',e);
    }
    render();
  }catch(e){
    console.warn('Base refresh:',e);
  }
}

async function boot(){
  const base=await fetchMatches();
  try{
    M=mergeLive(base,await fetchLive());
  }catch(e){
    M=base;
    console.warn('Inicio con matches.json:',e);
  }
  render();

  // Cloudflare is lightweight, so poll it frequently for score/status changes.
  setInterval(refreshLive,15000);
  // Re-read the full GitHub Pages dataset less often for new predictions/cards.
  setInterval(refreshBase,60000);
}
function state(m){
  if(m.status==='finished') return 'final';
  if(['interrupted','suspended','delayed','postponed'].includes(m.status)) return 'interrupted';
  if(m.status==='live') return 'live';
  if(m.status==='pending_result') return 'pending';
  return 'next';
}
let selectedDay=new Date().toISOString().slice(0,10);

function fmtDay(d){
  const x=new Date(d+"T12:00:00");
  return x.toLocaleDateString('es-EC',{
    weekday:'short',day:'2-digit',month:'short'
  }).toUpperCase();
}

function shiftDay(n){
  const d=new Date(selectedDay+"T12:00:00");
  d.setDate(d.getDate()+n);
  selectedDay=d.toISOString().slice(0,10);
  render();
}

function render(){
  const arr=M.filter(m=>{
    // Próximos is date-specific. Pending/results/all are historical views.
    const dateOK=(filter==='pending'||filter==='final'||filter==='all')
      ? true
      : String(m.date||'').slice(0,10)===selectedDay;
    const st=state(m); const stateOK=filter==='all'||st===filter||(filter==='live'&&st==='interrupted');
    return dateOK&&stateOK;
  });

  const selectedDateEl=document.getElementById('selectedDate');
  if(selectedDateEl){
    const today=new Date().toISOString().slice(0,10);
    selectedDateEl.textContent=(selectedDay===today?'HOY · ':'')+fmtDay(selectedDay);
  }

  const groups={};
  arr.forEach(m=>{
    const k=(m.tournament||'ATP')+'|'+(m.surface||'');
    (groups[k]??=[]).push(m);
  });

  Object.values(groups).forEach(ms=>{
    ms.sort((a,b)=>{
      const rank=x=>x.status==='live'?0:['interrupted','suspended','delayed','postponed'].includes(x.status)?1:x.status==='scheduled'?2:x.status==='finished'?3:4;
      const sr=rank(a)-rank(b);
      if(sr!==0) return sr;
      const ta=String(a.time_ecuador||a.source_time||'99:99');
      const tb=String(b.time_ecuador||b.source_time||'99:99');
      return ta.localeCompare(tb);
    });
  });

  grid.innerHTML=Object.entries(groups).map(([k,ms])=>{
    const [t,s]=k.split('|');
    return `<div class="tourneyHead">${t}<span>${s||''}</span></div>`+
      ms.map(card).join('');
  }).join('') || '<div class="empty">No hay partidos para esta fecha/filtro.</div>';
}

function liveBoard(m,st){
  const sets=(st?.sets||[]).filter(x=>x&&x.a!=null&&x.b!=null);
  const ga=st?.current_game?.player_a, gb=st?.current_game?.player_b;
  if(!sets.length && ga==null && gb==null) return '';
  const maxSets=Math.max(sets.length,1);
  const heads=Array.from({length:5},(_,i)=>`<span class="sh">${i<maxSets?'S'+(i+1):''}</span>`).join('');
  const vals=(who)=>Array.from({length:5},(_,i)=>{
    const set=sets[i]; const v=set?.[who];
    return `<span class="sv ${i===sets.length-1?'cur':''}">${v??''}</span>`;
  }).join('');
  const current=sets.length?sets[sets.length-1]:st?.current_set;
  const setNo=Math.max(1,sets.length);
  const gameLine=current&&current.a!=null&&current.b!=null
    ? `<div class="setNow">Set ${setNo} en juegos: <b>${current.a}-${current.b}</b>${ga!=null||gb!=null?` · puntos <b>${ga??'-'}-${gb??'-'}</b>`:''}</div>`
    : (ga!=null||gb!=null?`<div class="setNow">Puntos del game: <b>${ga??'-'}-${gb??'-'}</b></div>`:'');
  return `<div class="liveBoard"><div class="scoreGrid"><span></span>${heads}<span class="sh">PTS</span><span class="sn">${m.player_a}</span>${vals('a')}<span class="sv pts">${ga??'-'}</span><span class="sn">${m.player_b}</span>${vals('b')}<span class="sv pts">${gb??'-'}</span></div>${gameLine}</div>`;
}

function card(m){
  let s=state(m),st=m.live_state,pa=m.player_a_probability??.5,pb=m.player_b_probability??.5;
  let badge=s==='final'?'FINAL':s==='live'?'EN VIVO':s==='interrupted'?'INTERRUMPIDO':s==='pending'?'PENDIENTE':'PRÓXIMO';
  let provisional=m.prediction_status==='provisional_v13';
  let awaiting=m.prediction_status==='awaiting_prediction';
  let nums;
  if(['final','live','interrupted'].includes(s)) nums=[st?.set_score?.[0]??'',st?.set_score?.[1]??''];
  else if(awaiting) nums=['—','—'];
  else nums=[pct(pa),pct(pb)];

  let statusLine='';
  if(s==='live') statusLine=`<div class="liveScore"><span class="liveDot"></span>EN VIVO</div>${liveBoard(m,st)}`;
  else if(s==='interrupted') statusLine=`<div class="interruptedLine">⏸ ${m.interruption_reason||st?.stage||'Partido temporalmente interrumpido'}</div>${liveBoard(m,st)}`;

  let hint=s==='final'
    ? (st?.sets||[]).map(x=>x.a+'-'+x.b).join(' · ')+' · '+(st?.winner||'')
    : s==='live'
      ? `Sets ${st?.set_score?.[0]??'-'}-${st?.set_score?.[1]??'-'} · actualizado ${st?.synced_at?new Date(st.synced_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}):''}`
      : s==='interrupted'
        ? `Último marcador: ${st?.set_score?.[0]??'-'}-${st?.set_score?.[1]??'-'} · se mantiene visible hasta reanudación`
        : s==='pending'
          ? `${m.date} · Resultado pendiente de sincronizar`
          : `${m.date}${m.time_ecuador?' · '+m.time_ecuador+' EC':''} · ${m.surface||''}${provisional?' · análisis provisional':''}`;

  return `<article class="match ${s}" onclick="openM('${m.match_id}')">
    <div class="meta">${m.tournament||''} · ${m.round||''}<span class="badge ${s}">${badge}</span></div>
    <div class="row"><span class="name">${m.player_a}</span><span class="num">${nums[0]}</span></div>
    <div class="row"><span class="name">${m.player_b}</span><span class="num">${nums[1]}</span></div>
    ${statusLine}
    ${s==='next'&&!awaiting?`<div class="bar"><span style="width:${pa*100}%"></span><span style="width:${pb*100}%"></span></div>`:''}
    <div class="hint">${hint}</div>
  </article>`
}
function val(o,k,d='—'){let v=o?.[k];if(v===undefined||v===null)return d;return typeof v==='number'&&v<=1?(v*100).toFixed(1)+'%':v}
function metric(label,A,B,k){let av=val(A,k),bv=val(B,k);return `<div class="cmp"><b>${av}</b><div><div class="lab">${label}</div><div class="track"><span class="a" style="width:50%"></span><span class="b" style="width:50%"></span></div></div><b style="text-align:right">${bv}</b></div>`}
function openM(id){let m=M.find(x=>x.match_id===id),pa=m.player_a_probability??.5,pb=m.player_b_probability??.5,ph=m.analysis?.phase6||{},A=ph.player_a_tournament||m.tournament_performance?.player_a||{},B=ph.player_b_tournament||m.tournament_performance?.player_b||{},wa=ph.player_a_workload||{},wb=ph.player_b_workload||{},w=m.written_analysis||{},st=m.live_state;
let signals=[]; if((A.matches||0)>0&&(B.matches||0)>0){[['first_serve_won_pct','primer saque'],['second_serve_won_pct','segundo saque'],['return_points_won_pct','devolución'],['bp_save_pct','break points salvados']].forEach(([k,l])=>{if(A[k]!=null&&B[k]!=null){let fav=pa>=pb?m.player_a:m.player_b,lead=A[k]>B[k]?m.player_a:m.player_b;if(lead!==fav&&Math.abs(A[k]-B[k])>.02)signals.push(`${lead} supera al favorito en ${l} dentro del torneo.`)}})}
if(!signals.length)signals.push('No hay una contradicción estadística fuerte registrada con los datos actuales.');
let final=st?.status==='finished'?`<section class="panel finalbox"><h3>✅ RESULTADO FINAL</h3><div class="versus"><div><b>${m.player_a}</b><div class="big">${st.set_score?.[0]??0}</div></div><div class="vs">${(st.sets||[]).map(x=>x.a+'-'+x.b).join(' · ')}</div><div><b>${m.player_b}</b><div class="big">${st.set_score?.[1]??0}</div></div></div><p>Ganador: <b>${st.winner}</b></p></section><section class="panel audit"><h3>🧪 AUDITORÍA</h3><p class="text">${st.winner===(pa>=pb?m.player_a:m.player_b)?'La predicción previa acertó el ganador.':'La predicción previa falló. Este partido queda marcado para revisar qué señales fueron infraponderadas sin reentrenar por un único caso.'}</p></section>`:'';
detail.innerHTML=`<section class="scorehero"><div class="meta">${m.tournament} · ${m.round} · ${m.surface}</div><div class="versus"><div><b>${m.player_a}</b><div class="big">${pct(pa)}</div></div><div class="vs">VS</div><div><b>${m.player_b}</b><div class="big">${pct(pb)}</div></div></div></section>${final}<div class="columns"><div><section class="panel"><h3>🧠 LECTURA DEL PARTIDO</h3><p class="text">${w.summary||w.intro||(m.prediction_status==='awaiting_prediction'?'Partido descubierto automáticamente. El análisis todavía está esperando datos suficientes para calcular una predicción.':'La probabilidad combina nivel base, superficie, forma y contexto disponible.')}</p><p class="text">${w.reasons||''}</p></section><section class="panel warn"><h3>⚠️ SEÑALES CONTRA NUESTRA PREDICCIÓN</h3>${signals.map(x=>`<div class="signal bad"><i class="dot"></i><span>${x}</span></div>`).join('')}</section><section class="panel"><h3>⚔️ TORNEO ACTUAL · CARA A CARA</h3><div class="compare">${metric('1er saque ganado',A,B,'first_serve_won_pct')}${metric('2º saque ganado',A,B,'second_serve_won_pct')}${metric('Puntos al resto',A,B,'return_points_won_pct')}${metric('BP salvados',A,B,'bp_save_pct')}</div></section></div><div><section class="panel"><h3>⚡ FATIGA Y CARGA</h3><div class="stats"><div class="stat"><small>Fatiga ${m.player_a}</small><b>${val(wa,'fatigue_index',0)}</b></div><div class="stat"><small>Fatiga ${m.player_b}</small><b>${val(wb,'fatigue_index',0)}</b></div><div class="stat"><small>Minutos 72h</small><b>${val(wa,'fatigue_minutes_3d',0)}</b></div><div class="stat"><small>Rival · 72h</small><b>${val(wb,'fatigue_minutes_3d',0)}</b></div></div></section><section class="panel"><h3>📊 MODELOS</h3>${Object.entries(m.analysis?.component_probabilities_player_a||{}).map(([k,v])=>`<div class="signal good"><i class="dot"></i><span>${k}: <b>${pct(v)} ${m.player_a}</b></span></div>`).join('')||'<p class="mut">Sin desglose disponible.</p>'}</section><section class="panel"><h3>🎯 QUÉ MIRAR</h3><div class="signal"><i class="dot"></i><span>¿El favorito sostiene su segundo saque?</span></div><div class="signal"><i class="dot"></i><span>¿Quién crea más oportunidades de break?</span></div><div class="signal"><i class="dot"></i><span>Si el partido se alarga, la carga física gana peso.</span></div></section></div></div>`;
