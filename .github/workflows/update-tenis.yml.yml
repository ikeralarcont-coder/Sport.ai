name: Update tennis results

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: tennis-results-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update tennis matches
        run: python scripts/update_matches.py

      - name: Commit and push safely
        shell: bash
        run: |
          set -e

          if git diff --quiet -- matches.json; then
            echo "No new tennis data to commit."
            exit 0
          fi

          git config user.name "sports-ai-bot"
          git config user.email "sports-ai-bot@users.noreply.github.com"

          # Guardamos temporalmente el resultado generado
          cp matches.json /tmp/matches-updated.json

          # Nos sincronizamos con la versión más reciente de main
          git fetch origin main
          git reset --hard origin/main

          # Ejecutamos de nuevo el actualizador sobre el main más reciente
          python scripts/update_matches.py

          if git diff --quiet -- matches.json; then
            echo "Repository already contains the latest tennis data."
            exit 0
          fi

          git add matches.json
          git commit -m "Auto-update tennis results"
          git push origin HEAD:main
