name: Update tennis results

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: tennis-results-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update tennis matches and live API
        env:
          CLOUDFLARE_UPDATE_TOKEN: ${{ secrets.CLOUDFLARE_UPDATE_TOKEN }}
        run: python scripts/update_matches.py

      - name: Commit and push safely
        shell: bash
        run: |
          set -e
          if git diff --quiet -- matches.json; then
            echo "No new tennis data to commit."
            exit 0
          fi
          git config user.name "sports-ai-bot"
          git config user.email "sports-ai-bot@users.noreply.github.com"
          git add matches.json
          git commit -m "Auto-update tennis results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
